name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit + integration tests
        run: pytest -q
      - name: Fixture pipeline smoke
        run: ibpe run-pipeline --mode fixtures --force

  node-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install (matches Vercel)
        run: npm ci
      - name: Build web workspace (matches Vercel)
        run: npm run build --workspace=@ibpe/web
      - name: Node package placeholder checks
        run: bash scripts/ci_node_packages.sh
      - name: Web unit tests
        run: npm test --workspace=@ibpe/web
      - name: Search unit tests
        run: npm test --workspace=@ibpe/search
      - name: AI client unit tests (mocked OpenRouter)
        run: npm test --workspace=@ibpe/ai
      - name: Domain finance calculator + drill tests
        run: npm test --workspace=@ibpe/domain

  e2e:
    # Working Papers end to end in stub mode (no DATABASE_URL / Neon Auth).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Build web
        run: npm run build --workspace=@ibpe/web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: E2E
        run: npm run e2e --workspace=@ibpe/web
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Deploy jobs intentionally omitted until VERCEL_* secrets exist in Actions.
  # Preview-then-promote: docs/deployment/vercel-project-link.md
  # Prod smoke (Wave 3): scripts/prod_smoke.sh → reports/deployment-report.md
