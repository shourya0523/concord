concept_queries:
  - id: lbo
    phrase: LBO interview questions
    concepts: [LBO, leveraged buyout]
  - id: paper_lbo
    phrase: Paper LBO interview
    concepts: [Paper LBO, simplified LBO]
  - id: moic
    phrase: MOIC private equity interview
    concepts: [MOIC, multiple on invested capital]
  - id: irr
    phrase: IRR private equity interview
    concepts: [IRR, internal rate of return]
  - id: sources_uses
    phrase: sources and uses LBO
    concepts: [sources and uses]
  - id: debt_capacity
    phrase: debt capacity LBO interview
    concepts: [debt capacity, leverage]
  - id: returns_bridge
    phrase: returns bridge private equity
    concepts: [returns bridge, value creation bridge]
  - id: entry_exit_multiple
    phrase: entry exit multiple LBO
    concepts: [entry multiple, exit multiple]
  - id: working_capital
    phrase: working capital private equity interview
    concepts: [working capital, NWC]
  - id: add_on_acquisition
    phrase: add-on acquisition private equity
    concepts: [add-on, bolt-on]
  - id: management_presentation
    phrase: management presentation PE interview
    concepts: [management presentation, CIM]
  - id: investment_memo
    phrase: investment memo private equity
    concepts: [investment memo, IC memo]
  - id: ebitda_adjustments
    phrase: EBITDA adjustments PE interview
    concepts: [EBITDA adjustments, add-backs]
  - id: capital_structure
    phrase: capital structure LBO interview
    concepts: [capital structure, senior debt, mezz]
  - id: dpi_tvpi
    phrase: DPI TVPI private equity
    concepts: [DPI, TVPI, RVPI]

# Keyword hints used by the rule-based classifier (lowercase matching).
classifier_keywords:
  core_pe_investing:
    positive:
      - private equity analyst
      - private equity associate
      - pe analyst
      - pe associate
      - senior associate private equity
      - pe senior associate
      - investment associate
      - investment analyst
      - investment professional
      - buyout associate
      - buyout analyst
      - pre-mba associate
      - post-mba associate
      - pe principal
      - private equity principal
      - pe vice president
      - vice president private equity
      - vp private equity
      - private equity intern
      - pe intern
      - summer analyst private equity
      - pe summer analyst
      - off-cycle private equity
      - off cycle pe
      - direct investments
      - leveraged buyout
  adjacent_pe_investing:
    positive:
      - growth equity
      - private credit
      - direct lending
      - private debt
      - distressed
      - special situations
      - secondaries
      - co-investment
      - co investment
      - real estate private equity
      - repe
      - infrastructure equity
      - infrastructure associate

  portfolio_operations:
    positive:
      - portfolio operations
      - portfolio ops
      - value creation
      - operating partner
      - portfolio company operations
      - pe operating
      - talent value creation

  allocator_or_fund_selection:
    positive:
      - fund of funds
      - fund-of-funds
      - fof associate
      - lp allocator
      - pension allocator
      - endowment private equity
      - manager selection
      - fund selection

  pe_advisory:
    positive:
      - financial sponsors
      - sponsor coverage
      - transaction services
      - quality of earnings
      - qoe
      - financial due diligence
      - pe due diligence consultant
      - strategy consultant private equity

  fund_operations:
    positive:
      - fund accountant
      - fund accounting
      - fund controller
      - investor relations
      - pe investor relations
      - placement agent
      - capital raising
      - fundraising associate
      - fund compliance
      - pe compliance
      - fund administrator
      - fund admin

  not_pe:
    positive:
      - pe recruiter
      - private equity recruiter
      - recruitment consultant
      - executive search
      - wealth manager
      - private wealth
      - pe software
      - saas sales
      - private equity lawyer
      - pe counsel
      - fund formation lawyer
      - investment funds lawyer
      - legal counsel
