# Private equity role taxonomy for Glassdoor discovery and relevance classification.
# Labels map to ibpe_corpus.schemas.models.PERelevance values.

version: 1

relevance_labels:
  core_pe_investing: core_pe_investing
  adjacent_pe_investing: adjacent_pe_investing
  portfolio_operations: portfolio_operations
  allocator_or_fund_selection: allocator_or_fund_selection
  pe_advisory: pe_advisory
  fund_operations: fund_operations
  not_pe: not_pe

core_investing_roles:
  - id: pe_analyst
    label: Private Equity Analyst
    aliases:
      - Private Equity Analyst
      - PE Analyst
      - Investment Analyst Private Equity
      - Buyout Analyst
    seniority: analyst
    relevance: core_pe_investing

  - id: pe_associate
    label: Private Equity Associate
    aliases:
      - Private Equity Associate
      - PE Associate
      - Investment Associate Private Equity
      - Buyout Associate
    seniority: associate
    relevance: core_pe_investing

  - id: pe_senior_associate
    label: Private Equity Senior Associate
    aliases:
      - Private Equity Senior Associate
      - PE Senior Associate
      - Senior Associate Private Equity
    seniority: senior_associate
    relevance: core_pe_investing

  - id: investment_analyst
    label: Investment Analyst
    aliases:
      - Investment Analyst
      - PE Investment Analyst
      - Direct Investment Analyst
    seniority: analyst
    relevance: core_pe_investing

  - id: investment_associate
    label: Investment Associate
    aliases:
      - Investment Associate
      - PE Investment Associate
      - Direct Investments Associate
    seniority: associate
    relevance: core_pe_investing

  - id: investment_professional
    label: Investment Professional
    aliases:
      - Investment Professional
      - Private Equity Investment Professional
      - PE Investment Professional
    seniority: professional
    relevance: core_pe_investing

  - id: pe_principal
    label: Principal
    aliases:
      - Private Equity Principal
      - PE Principal
      - Principal Private Equity
      - Investment Principal
    seniority: principal
    relevance: core_pe_investing

  - id: pe_vp
    label: Vice President PE
    aliases:
      - Private Equity Vice President
      - PE Vice President
      - Vice President Private Equity
      - VP Private Equity
    seniority: vp
    relevance: core_pe_investing

  - id: pre_mba_associate
    label: Pre-MBA Associate
    aliases:
      - Pre-MBA Associate
      - Pre MBA Associate Private Equity
      - Pre-MBA PE Associate
    seniority: associate
    relevance: core_pe_investing

  - id: post_mba_associate
    label: Post-MBA Associate
    aliases:
      - Post-MBA Associate
      - Post MBA Associate Private Equity
      - Post-MBA PE Associate
    seniority: associate
    relevance: core_pe_investing

  - id: pe_intern
    label: Private Equity Intern
    aliases:
      - Private Equity Intern
      - PE Intern
      - Investment Intern Private Equity
    seniority: intern
    relevance: core_pe_investing

  - id: summer_analyst
    label: Summer Analyst PE
    aliases:
      - Private Equity Summer Analyst
      - PE Summer Analyst
      - Summer Analyst Private Equity
    seniority: summer_analyst
