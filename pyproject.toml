[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibpe-corpus"
version = "0.1.0"
description = "Automated investment banking and private equity interview corpus pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "PyYAML>=6.0",
  "rapidfuzz>=3.6",
  "tenacity>=8.2",
  "SQLAlchemy>=2.0",
  "typer>=0.12",
  "rich>=13.7",
  "jsonschema>=4.21",
  "python-dateutil>=2.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
browser = ["selenium>=4.21", "seleniumbase>=4.27"]

[project.scripts]
ibpe = "ibpe_corpus.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "network: tests that require outbound network access",
]

[tool.ibpe]
parser_version = "glassdoor-parser-v1"
generator_version = "answer-gen-v1"
validator_version = "answer-val-v1"
