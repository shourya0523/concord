# GitHub corpus sources. `import_priority` high|medium|low are imported by the
# fixture pipeline from data/staging/github/<owner>_<repo>/<path>; pattern_only /
# "no" are never imported. `license_status` feeds reports/license-review.md.

owner_attestation:
  date: "2026-09-23"
  attested_by: repository owner (Concord)
  recorded_by: content track (plan 2026-09-23-001, OQ-1 / P1.1)
  scope: >-
    All sources below with product_role teaching_qa
    (ddeng5/Capital-Markets-Question-Bank-App, coryjburk/intv-playbook-ib_vc,
    coryjburk/intv-playbook-pe_vc, HireAbo/awesome-interview-questions-5000-jobs,
    offergenieai/Finance-Interview-Questions).
  statement: >-
    The repository owner confirmed on 2026-09-23 that Concord has permission to
    use all listed sources for the teaching corpus. Attribution is kept on answer
    provenance (source_ids, source artefact URLs).

sources:
