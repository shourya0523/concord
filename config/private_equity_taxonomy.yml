  - id: off_cycle
    label: Off-Cycle Analyst/Associate
    aliases:
      - Off-Cycle Private Equity
      - Off Cycle PE Analyst
      - Off-Cycle PE Associate
      - Off Cycle Private Equity Associate
    seniority: off_cycle
    relevance: core_pe_investing

  - id: pe_director
    label: Director / Managing Director PE
    aliases:
      - Private Equity Director
      - PE Director
      - Managing Director Private Equity
      - PE Managing Director
    seniority: md
    relevance: core_pe_investing

strategy_roles:
  - id: buyout
    label: Buyout
    aliases: [Buyout, Leveraged Buyout, LBO]
    search_modifiers: [Buyout, LBO]
    relevance: core_pe_investing

  - id: growth_equity
    label: Growth Equity
    aliases: [Growth Equity, Growth Investing, Expansion Capital]
    search_modifiers: [Growth Equity, Growth Capital]
    relevance: core_pe_investing

  - id: middle_market
    label: Middle-Market
    aliases: [Middle Market, Mid-Market, MM PE]
    search_modifiers: [Middle Market Private Equity, Mid-Market PE]
    relevance: core_pe_investing

  - id: lmm
    label: Lower Middle Market
    aliases: [Lower Middle Market, LMM, Small Buyout]
