  - id: special_situations
    label: Special Situations
    aliases: [Special Situations, Spec Sit, Opportunistic Credit]
    search_modifiers: [Special Situations Associate, Spec Sit PE]
    relevance: adjacent_pe_investing

  - id: infrastructure
    label: Infrastructure
    aliases: [Infrastructure, Infra PE, Infrastructure Equity]
    search_modifiers: [Infrastructure Private Equity, Infra Associate]
