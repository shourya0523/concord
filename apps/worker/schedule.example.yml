# Example schedules for scrape / transform / enrich workers.
# Enable only after HTTPS_PROXY + session secrets are on the worker host.
# Never point these at Vercel serverless request handlers for long crawls.

schedules:
  - name: bff-scrape-pe-daily
    cron: "0 6 * * *"
    command: >
      python main.py batch --backend bff --track PE --limit 5
    env_from: worker-secrets

  - name: corpus-fixtures-nightly
    cron: "30 7 * * *"
    command: >
      ibpe run-pipeline --mode fixtures --force
    env_from: worker-secrets

  # Taxonomy + rubric enrichment runs inside run-pipeline (heuristic without a key;
  # with OPENROUTER_API_KEY the small model handles only what heuristics cannot
  # auto-approve, escalating to LLM_PRIMARY_MODEL on validation failure — ADR 0007).
  # Proposals persist in the corpus DB and exports/enrichment_proposals.jsonl;
  # publish applies approved ones.
  - name: llm-enrich-nightly
    cron: "0 8 * * *"
    command: >
      ibpe run-pipeline --mode fixtures --force --llm
      && python -m ibpe_corpus.answers.enrich_job --questions-jsonl exports/questions.jsonl
      --db data/db/corpus.db --limit 200
    env_from: worker-secrets

  - name: publish-teaching-nightly
    cron: "0 9 * * *"
    command: >
      npm run publish:teaching -w @ibpe/database -- --retire-missing
      && npm run embed:rag -w @ibpe/database
    env_from: worker-secrets

# Optional: Vercel Cron hits a short enqueue API; worker pulls the job.
vercel_enqueue:
  path: /api/cron/enqueue-scrape
  schedule: "0 6 * * *"
  auth_header: "Authorization: Bearer $CRON_SECRET"
  note: "Handler must enqueue only — do not run batch scrape inline"
